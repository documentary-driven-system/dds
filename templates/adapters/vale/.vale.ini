# Optional prose lint for .dds/ documents (https://vale.sh). Copy .vale.ini and styles/ to the repository root.
# Suggestion level only: the linguistic rules in the write protocols are conventions, and no linter can judge
# whether a pronoun's referent lives inside the current section. These rules flag the likely cases.
# Unvalidated: written against the Vale rule reference without a Vale binary at hand; run `vale sync && vale .dds` first.
StylesPath = styles
MinAlertLevel = suggestion

[.dds/**/*.dds.md]
BasedOnStyles = DDS
