name: ci

on:
  pull_request:
  push:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Template passes the gate
        run: python .dds/meta/scripts/dds.py check --gate
      - name: Broken fixture fails the gate
        shell: bash
        run: |
          if python .dds/meta/scripts/dds.py --root examples/broken check --gate; then
            echo "examples/broken must fail" >&2; exit 1
          fi
      - name: Unit tests
        run: python -m unittest discover -s tests -v
